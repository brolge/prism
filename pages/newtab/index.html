<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prism</title>
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <div class="stars" aria-hidden="true"></div>
    <main class="panel">
      <img class="logo" src="../../icons/icon256.png" alt="Prism" />
      <h1 class="brand">Prism</h1>
      <p class="tagline">Search the web</p>
      <form id="lookup-form" class="form" autocomplete="off">
        <div class="field">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
            <path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <input
            id="lookup-input"
            class="input"
            type="search"
            name="q"
            placeholder="Search Prism…"
            maxlength="2048"
            spellcheck="false"
            autofocus
          />
          <button type="submit" class="go">Search</button>
        </div>
      </form>
      <div class="chips">
        <button type="button" class="chip" data-query="lucia gta 6">Lucia · GTA 6</button>
        <button type="button" class="chip" data-query="weather in London">Weather</button>
        <button type="button" class="chip" data-query="latest tech news">News</button>
        <button type="button" class="chip" data-href="min://app/pages/settings/index.html">Settings</button>
      </div>
      <p class="footer">Prism Lookup</p>
    </main>
    <script src="newtab.js"></script>
  </body>
</html>
